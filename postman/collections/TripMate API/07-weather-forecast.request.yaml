$kind: http-request
name: 07 - Weather Forecast
order: 7000
method: GET
url: '{{baseUrl}}/api/weather?city=Da%20Nang'
queryParams:
  - key: city
    value: 'Da Nang'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Weather forecast payload valid', function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data).to.be.an('object');
      });
